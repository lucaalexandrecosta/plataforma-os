# Pedido de página (docs/08 §2.6). limit padrão 50, máximo 200. sort aceita só
# os campos listados por recurso; outro → INVALID_FILTER. cursor é opaco.
class: PageRequest
fields:
  limit: int?
  sort: String?
  descending: bool?
  cursor: String?
  # Total só sob pedido, limitado a 10 000 (totalIsEstimate acima disso).
  includeTotal: bool?

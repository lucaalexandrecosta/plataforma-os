# Uma ação do técnico feita no aparelho (docs/06 §6.6). type: visit.start_travel,
# visit.check_in, visit.pause, visit.resume, visit.finish ou
# checklist_response.submit; entityId é a visita. payload: JSON de
# VisitMutationPayload (ou ChecklistSubmitPayload no checklist).
class: SyncMutation
fields:
  mutationId: UuidValue
  type: String
  entityId: UuidValue
  clientTimestamp: DateTime
  payload: String

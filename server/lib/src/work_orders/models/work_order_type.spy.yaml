# Tipo de OS (app.work_order_types): corretiva, preventiva, instalação...
class: WorkOrderType
fields:
  id: UuidValue
  code: String
  name: String
  # corrective, preventive, installation, removal, inspection, refurbishment, teardown, other.
  category: String
  # low, normal, high, urgent.
  defaultPriority: String
  # Exige bem na abertura.
  requiresAsset: bool
  isActive: bool
  version: int
  # Checklist padrão das visitas (vale a versão publicada mais nova do código).
  defaultChecklistTemplateId: UuidValue?
  defaultChecklistName: String?
  # Concluir como resolvida exige foto de antes e de depois.
  requirePhotos: bool, default=false
  # Concluir como resolvida exige a assinatura do cliente.
  requireSignature: bool, default=false

# Dados editáveis do tipo de OS (workOrders.createType e updateType).
class: WorkOrderTypeInput
fields:
  code: String
  name: String
  category: String
  defaultPriority: String
  requiresAsset: bool
  isActive: bool
  # Checklist publicado (opcional).
  defaultChecklistTemplateId: UuidValue?
  # Obrigatoriedades ao concluir como resolvida (padrão: não exige).
  requirePhotos: bool?
  requireSignature: bool?

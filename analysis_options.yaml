# Convenções de docs/02 §6.2: strict-casts, strict-inference, strict-raw-types.
include: package:lints/recommended.yaml

formatter:
  page_width: 120
  trailing_commas: preserve

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/generated/**"
    - "**/test_tools/**"
    - "**/*.g.dart"
    - "server_client/lib/src/protocol/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - directives_ordering

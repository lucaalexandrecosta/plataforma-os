  go_router: ^17.0.0
  intl: any
  plataforma_os_client: any
  serverpod_auth_core_client: 4.1.1
  serverpod_client: 4.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# App do técnico (Flutter iOS/Android): login próprio, escolha de empresa,
# agenda do técnico e execução da visita. Primeira fatia online; banco local
# e sync offline (docs/06 §5 e §6) vêm na próxima.
name: plataforma_os_field
description: App de campo do técnico da plataforma de OS.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  geolocator: ^14.0.0
  go_router: ^17.0.0
  intl: any
  mobile_scanner: ^7.0.0
  plataforma_os_client: any
  serverpod_auth_core_client: 4.1.1
  serverpod_client: 4.1.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  meta: ^1.19.0

flutter:
  uses-material-design: true
